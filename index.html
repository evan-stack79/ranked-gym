<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
    <meta name="theme-color" content="#0C0C0E" />
    <meta name="theme-color" content="#0C0C0E" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Ranked Gym — Réseau social de musculation gamifié" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ranked Gym" />
    <meta name="application-name" content="Ranked Gym" />
    <meta name="format-detection" content="telephone=no" />
    <meta http-equiv="Permissions-Policy" content="camera=(self), microphone=(), geolocation=(self)" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' https://maps.googleapis.com https://maps.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https://*.supabase.co https://*.convex.cloud https://*.convex.site; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.convex.cloud wss://*.convex.cloud https://*.convex.site https://maps.googleapis.com https://maps.gstatic.com https://photon.komoot.io https://nominatim.openstreetmap.org https://world.openfoodfacts.org; media-src 'self' blob: mediastream:; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'none'; manifest-src 'self'; upgrade-insecure-requests"
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preload" as="image" href="/brand-splash-calm.png" />
    <link rel="preload" as="image" href="/brand-splash-roar.png" />
    <title>Ranked Gym</title>
    <script src="/boot-t0.js"></script>
    <style>
      html,
      body {
        margin: 0;
        background-color: #000000;
        color: #ffffff;
      }
      #root {
        min-height: 100vh;
        min-height: 100dvh;
      }
      /* Splash natif immédiat — fond noir, panthère calme, safe areas */
      .boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000000;
        padding:
          env(safe-area-inset-top, 0px)
          env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px)
          env(safe-area-inset-left, 0px);
      }
      .boot-splash__inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
      }
      .boot-splash img {
        width: 180px;
        height: 180px;
        object-fit: contain;
        display: block;
      }
      .boot-splash strong {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        font-size: 1.125rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: #ffffff;
      }
      .boot-splash strong span {
        color: #ff2b2b;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" aria-live="polite" aria-busy="true" aria-label="Ranked Gym">
        <div class="boot-splash__inner">
          <img src="/brand-splash-calm.png" width="180" height="180" alt="" />
          <strong>Ranked <span>Gym</span></strong>
        </div>
      </div>
    </div>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui, sans-serif; color: #fff; background: #000">
        Ranked Gym nécessite JavaScript. Active-le pour utiliser l’application.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
