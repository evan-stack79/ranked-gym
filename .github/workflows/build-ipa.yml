name: Build IPA

# Unsigned IPA only — no App Store / TestFlight deploy.
# workflow_dispatch: launch manually on ANY branch (Actions → Build IPA → Run workflow).
# push/PR: also builds when iOS/web sources change (including PR branches).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'ios-native/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/build-ipa.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'ios-native/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/build-ipa.yml'

permissions:
  contents: read

jobs:
  build-ipa:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Node version
        id: node
        run: |
          if [ -f .nvmrc ]; then
            echo "version=$(tr -d 'v[:space:]' < .nvmrc)" >> "$GITHUB_OUTPUT"
          else
            ver=$(python3 -c 'import json,re,pathlib; p=pathlib.Path("package.json"); e=(json.loads(p.read_text()).get("engines") or {}) if p.exists() else {}; n=str(e.get("node") or ""); m=re.search(r"(\d+)", n); print(m.group(1) if m else "22")')
            echo "version=$ver" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - name: Install JS deps
        run: |
          # sharp/libvips download can time out on macOS runners — one retry.
          npm ci || {
            echo "npm ci failed once; retrying after 15s…"
            sleep 15
            npm ci
          }

      - name: Build web assets
        run: npm run build
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
          VITE_CONVEX_SITE_URL: ${{ secrets.VITE_CONVEX_SITE_URL }}
          VITE_ENABLE_CONVEX_AUTH: "true"
          VITE_ENABLE_CONVEX_PRIMARY: "true"

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      # Durable guards — these fixes vanished from main IPAs when they lived only on
      # unmerged test branches (#117/#118/#119). Fail the build if sync/config regresses.
      - name: Guard iOS safe-area + native plugin contracts (source)
        run: |
          set -euo pipefail

          echo "== capacitor.config.ts =="
          grep -q "contentInset: 'never'" capacitor.config.ts
          ! grep -q "contentInset: 'automatic'" capacitor.config.ts
          grep -q "overlaysWebView: true" capacitor.config.ts

          echo "== MainViewController.swift =="
          MVC="ios/App/App/MainViewController.swift"
          test -f "$MVC"
          grep -q 'contentInsetAdjustmentBehavior = .never' "$MVC"
          grep -q 'SecureStoragePlugin' "$MVC"
          grep -q 'preferredStatusBarStyle' "$MVC"

          echo "== Info.plist status bar ownership =="
          PLIST="ios/App/App/Info.plist"
          # Avoid `grep | grep -q` under pipefail (SIGPIPE) — dump then grep the file.
          PLIST_STATUS_DUMP="$RUNNER_TEMP/plist-status-bar.txt"
          grep -A1 'UIViewControllerBasedStatusBarAppearance' "$PLIST" > "$PLIST_STATUS_DUMP"
          grep -q '<true/>' "$PLIST_STATUS_DUMP"

          echo "== Synced capacitor.config.json (cap sync output) =="
          # cap sync writes JSON next to the App target; accept either path Cap uses.
          CFG=""
          for candidate in \
            ios/App/App/capacitor.config.json \
            ios/App/capacitor.config.json \
            ios/App/App/capacitor.config.js
          do
            if [ -f "$candidate" ]; then CFG="$candidate"; break; fi
          done
          if [ -z "$CFG" ]; then
            echo "Looking for synced capacitor config…"
            find ios -name 'capacitor.config.*' -print || true
            echo "ERROR: capacitor.config.json missing after cap sync"
            exit 1
          fi
          echo "Using $CFG"
          # JSON may pretty-print; require never + overlaysWebView true
          python3 - "$CFG" <<'PY'
          import json, sys
          path = sys.argv[1]
          with open(path) as f:
              data = json.load(f)
          inset = (data.get("ios") or {}).get("contentInset")
          if inset != "never":
              raise SystemExit(f"ios.contentInset must be 'never', got {inset!r} in {path}")
          status = (data.get("plugins") or {}).get("StatusBar") or {}
          if status.get("overlaysWebView") is not True:
              raise SystemExit(f"StatusBar.overlaysWebView must be true, got {status!r} in {path}")
          print("synced capacitor config OK (contentInset=never, overlaysWebView=true)")
          PY

          echo "== CapApp-SPM includes StatusBar after sync =="
          PKG="ios/App/CapApp-SPM/Package.swift"
          test -f "$PKG"
          grep -q 'CapacitorStatusBar\|status-bar' "$PKG"

          echo "== BottomNav full-bleed (IPA #131 L/R + bottom band) =="
          BN="src/components/layout/BottomNav.tsx"
          test -f "$BN"
          BN_DUMP="$RUNNER_TEMP/bottom-nav-src.txt"
          cat "$BN" > "$BN_DUMP"
          if grep -E "width:[[:space:]]*'[^']*100vw[[:space:]]*-[[:space:]]*2\\.5rem" "$BN_DUMP"; then
            echo "ERROR: floating pill still uses calc(100vw - 2.5rem) side margins"
            exit 1
          fi
          if grep -E "bottom:[[:space:]]*'max\\(0\\.[57]5rem" "$BN_DUMP"; then
            echo "ERROR: BottomNav still offsets with bottom:max(safe-area) (black band)"
            exit 1
          fi
          grep -q 'data-bottom-nav-edge="flush"' "$BN_DUMP"
          grep -q 'paddingBottom' "$BN_DUMP"
          echo "BottomNav flush + single internal safe-area OK"

          echo "== LaunchScreen.storyboard full-bleed (confirm-only) =="
          LS_SRC="ios/App/App/Base.lproj/LaunchScreen.storyboard"
          test -f "$LS_SRC"
          LS_DUMP="$RUNNER_TEMP/launchscreen-src.txt"
          cat "$LS_SRC" > "$LS_DUMP"
          if grep -q '<imageView[[:space:]]*key="view"' "$LS_DUMP"; then
            echo "ERROR: LaunchScreen root is UIImageView (letterbox risk)"
            exit 1
          fi
          grep -q 'widthSizable="YES"' "$LS_DUMP"
          grep -q 'heightSizable="YES"' "$LS_DUMP"
          echo "LaunchScreen source contract OK"

          echo "Source + sync guards OK"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build iOS app (unsigned)
        working-directory: ios/App
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/xcodebuild-unsigned.log"
          # SPM binary targets (Capacitor.xcframework.zip) can 504 from GitHub Releases.
          # Retry the whole xcodebuild once after clearing DerivedData SPM caches.
          attempt=1
          max_attempts=2
          STATUS=1
          while [ "$attempt" -le "$max_attempts" ]; do
            echo "==== xcodebuild attempt $attempt/$max_attempts ===="
            rm -rf "$RUNNER_TEMP/DerivedData"
            set +e
            xcodebuild \
              -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$RUNNER_TEMP/DerivedData" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              DEVELOPMENT_TEAM="" \
              PROVISIONING_PROFILE_SPECIFIER="" \
              ONLY_ACTIVE_ARCH=NO \
              build 2>&1 | tee "$LOG"
            STATUS=${PIPESTATUS[0]}
            set -e
            if [ "$STATUS" -eq 0 ] && grep -q "BUILD SUCCEEDED" "$LOG"; then
              break
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "xcodebuild failed (status=$STATUS); retrying in 20s (SPM/GitHub flake)…"
              sleep 20
            fi
            attempt=$((attempt + 1))
          done

          echo "---- xcodebuild filtered (error|warning|BUILD) ----"
          grep -E "error:|warning:|BUILD " "$LOG" || true

          if [ "$STATUS" -ne 0 ] || ! grep -q "BUILD SUCCEEDED" "$LOG"; then
            echo "---- xcodebuild tail (last 80 lines) ----"
            tail -n 80 "$LOG" || true
            exit "${STATUS:-1}"
          fi

      - name: Package unsigned IPA
        id: package
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/App.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "App.app not found at $APP_PATH"
            find "$RUNNER_TEMP/DerivedData/Build/Products" -maxdepth 3 -type d -name '*.app' || true
            exit 1
          fi

          # Guard: local CAP plugins must be hosted by MainViewController (registers in
          # capacitorDidLoad). Without MainViewController, login fails with:
          # "SecureStorage" plugin is not implemented on ios.
          #
          # Do NOT require the literal "capacitorDidLoad" via strings(1): that Swift
          # override name is often absent from Release-stripped binaries even when
          # the override is linked (false negative on main after #137 —
          # actions/runs/41315756901). Prefer stable ObjC/class string markers:
          # MainViewController (host) + SecureStoragePlugin (plugin class/@objc name).
          APP_BINARY="$APP_PATH/App"
          if [ ! -f "$APP_BINARY" ]; then
            APP_BINARY="$(find "$APP_PATH" -maxdepth 1 -type f -perm -111 | head -n 1 || true)"
          fi
          if [ -z "${APP_BINARY:-}" ] || [ ! -f "$APP_BINARY" ]; then
            echo "App binary not found inside $APP_PATH"
            ls -la "$APP_PATH" || true
            exit 1
          fi
          # Dump strings once, then grep the file. Never `strings | grep -q` under
          # pipefail: grep -q exits early → SIGPIPE on strings → false failure (QA M2).
          echo "Checking native plugin registration symbols in $APP_BINARY"
          STRINGS_DUMP="$RUNNER_TEMP/app-binary-strings.txt"
          strings "$APP_BINARY" >"$STRINGS_DUMP" 2>/dev/null || true
          if ! grep -q 'MainViewController' "$STRINGS_DUMP"; then
            echo "ERROR: MainViewController missing from App binary — SecureStorage will not register on iOS"
            exit 1
          fi
          if ! grep -q 'SecureStoragePlugin' "$STRINGS_DUMP"; then
            echo "ERROR: SecureStoragePlugin missing from App binary — Keychain plugin not linked"
            exit 1
          fi
          # StatusBar overlay plugin (safe-area / Dynamic Island full-bleed).
          if ! grep -qi 'StatusBar' "$STRINGS_DUMP"; then
            echo "ERROR: StatusBar symbols missing from App binary — overlaysWebView will not apply"
            exit 1
          fi
          echo "Native plugin registration symbols present (MainViewController / SecureStoragePlugin / StatusBar)"

          # LaunchScreen compiled into .app (presence guard; full-bleed checked on source above).
          echo "== LaunchScreen in packaged .app =="
          LS_APP="$(find "$APP_PATH" \( -name 'LaunchScreen.storyboardc' -o -name 'LaunchScreen.storyboard' \) | head -n 1 || true)"
          if [ -z "${LS_APP:-}" ]; then
            echo "ERROR: LaunchScreen missing from App.app"
            find "$APP_PATH" -iname '*Launch*' -print || true
            exit 1
          fi
          echo "LaunchScreen present: $LS_APP"

          STAGE="$RUNNER_TEMP/ipa-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP_PATH" "$STAGE/Payload/"

          COMMIT_SHORT="${GITHUB_SHA::7}"
          IPA_NAME="RankedGym-unsigned-${COMMIT_SHORT}.ipa"
          IPA_PATH="$RUNNER_TEMP/$IPA_NAME"

          (
            cd "$STAGE"
            zip -qry "$IPA_PATH" Payload
          )

          echo "ipa_name=$IPA_NAME" >> "$GITHUB_OUTPUT"
          echo "ipa_path=$IPA_PATH" >> "$GITHUB_OUTPUT"
          ls -lh "$IPA_PATH"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ranked-gym-ios-ipa
          path: ${{ steps.package.outputs.ipa_path }}
          if-no-files-found: error
          retention-days: 14
