<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>DI Widget previews — Ranked Gym</title>
  <style>
    :root {
      --red: #FF2B2B;
      --track: #3A3A3C;
      --green: #30D158;
      --orange: #FF9F0A;
      --gold: #FFD60A;
      --pause: #2C2C2E;
      --stop: #5A1414;
      --gray: #8E8E93;
      --pr-circle: #3D2A05;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
      color: #fff;
      padding: 24px;
    }
    h1 { font-size: 18px; font-weight: 600; margin: 0 0 8px; }
    .note { color: var(--gray); font-size: 12px; margin-bottom: 24px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }
    .card {
      background: #1c1c1e;
      border-radius: 16px;
      padding: 16px;
    }
    .card h2 {
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--gray);
      margin: 0 0 12px;
      font-weight: 600;
    }
    .stage {
      background: #000;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 120px;
      padding: 16px;
    }
    .shot-root { display: inline-flex; }

    .compact {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      background: #000;
      border-radius: 999px;
      padding: 8px 14px;
      min-width: 168px;
      border: 1px solid #222;
    }
    .minimal {
      width: 40px; height: 40px;
      border-radius: 999px;
      background: #000;
      border: 1px solid #222;
      display: flex; align-items: center; justify-content: center;
    }
    .expanded, .lock {
      width: 100%;
      max-width: 360px;
      background: #000;
      border-radius: 28px;
      padding: 12px 14px;
      position: relative;
    }
    .lock.border-red { outline: 2px solid var(--red); outline-offset: -2px; }
    .lock.border-orange { outline: 2px solid var(--orange); outline-offset: -2px; }
    .lock.border-gold { outline: 2px solid var(--gold); outline-offset: -2px; }

    .ring {
      width: 20px; height: 20px; border-radius: 50%;
      background: conic-gradient(var(--ring-color, var(--red)) calc(var(--p, 0.6) * 1turn), var(--track) 0);
      mask: radial-gradient(circle at center, transparent 52%, #000 54%);
      -webkit-mask: radial-gradient(circle at center, transparent 52%, #000 54%);
      transform: rotate(-90deg);
      flex-shrink: 0;
    }
    .ring.lg { width: 48px; height: 48px; }
    .ring.xl { width: 64px; height: 64px; }
    .ring-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .ring-wrap .pct {
      position: absolute;
      font-size: 11px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #fff;
      transform: none;
    }
    .chrono-red {
      color: var(--red); font-weight: 700;
      font-variant-numeric: tabular-nums; font-size: 17px;
    }
    .chrono-white { color: #fff; font-weight: 700; font-variant-numeric: tabular-nums; }
    .chrono-xl { font-size: 34px; line-height: 1; }
    .label-gray { color: var(--gray); font-size: 11px; font-weight: 600; }
    .row { display: flex; align-items: center; gap: 10px; }
    .row.between { justify-content: space-between; }
    .col { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .col.left { align-items: flex-start; }
    .btn-circle {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      border: none; color: #fff; font-size: 13px; flex-shrink: 0;
    }
    .btn-pause { background: var(--pause); }
    .btn-stop { background: var(--stop); color: var(--red); font-weight: 700; }
    .btn-validate {
      background: var(--green); color: #000; border: none;
      border-radius: 12px; padding: 7px 12px; font-weight: 700; font-size: 13px;
    }
    .pr {
      background: var(--orange); color: #000; font-weight: 800; font-size: 11px;
      border-radius: 8px; padding: 3px 7px;
    }
    .pr-circle {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--pr-circle);
      display: flex; align-items: center; justify-content: center;
      color: var(--orange); font-weight: 800; font-size: 16px; flex-shrink: 0;
    }
    .diamond {
      width: 14px; height: 14px; background: var(--gold);
      transform: rotate(45deg); border-radius: 2px; flex-shrink: 0;
    }
    .diamond.lg {
      width: 40px; height: 40px; border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
    }
    .diamond.lg span {
      transform: rotate(-45deg); color: #000; font-weight: 800; font-size: 12px;
    }
    .bars { display: flex; gap: 4px; width: 100%; }
    .bars i { flex: 1; height: 5px; border-radius: 999px; background: var(--track); display: block; }
    .bars i.on { background: var(--red); }
    .s-red {
      color: var(--red); font-weight: 700;
      font-variant-numeric: tabular-nums; font-size: 15px;
    }
    .s-red.min { font-size: 13px; }
    .green { color: var(--green); font-weight: 700; font-variant-numeric: tabular-nums; }
    .orange { color: var(--orange); font-weight: 700; }
    .gold { color: var(--gold); font-weight: 700; }
    .expanded-rest-grid {
      display: grid;
      grid-template-columns: 36px 1fr 36px;
      gap: 8px;
      align-items: center;
    }
    .dense-session { width: 100%; display: flex; flex-direction: column; gap: 3px; }
    .dense-session .ex { font-size: 15px; font-weight: 700; }
    .dense-session .series { font-size: 13px; font-weight: 600; color: var(--red); }
    .dense-session .load { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .dense-session .elapsed { font-size: 13px; font-weight: 600; color: var(--gray); font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <h1>Dynamic Island — previews gen.py / maquettes 01–06</h1>
  <p class="note">Rendu HTML aligné sur RestTimerLiveActivityWidget.swift (pas de +15, pas de cadre rouge DI, compact = anneau+chrono / minimal = anneau ou S2).</p>
  <div class="grid" id="grid"></div>
  <script>
    const shots = [];
    function add(id, title, html) {
      shots.push({ id, title, html });
    }

    add('rest-compact', '01 · repos compact', `
      <div class="compact shot-root" data-shot="rest-compact">
        <div class="ring" style="--p:0.6;--ring-color:var(--red)"></div>
        <div class="chrono-red">1:12</div>
      </div>`);
    add('rest-minimal', '06 · repos minimal', `
      <div class="minimal shot-root" data-shot="rest-minimal">
        <div class="ring" style="--p:0.6;--ring-color:var(--red)"></div>
      </div>`);
    add('rest-expanded', '01 · repos étendu (DI, sans cadre)', `
      <div class="expanded shot-root" data-shot="rest-expanded">
        <div class="expanded-rest-grid">
          <div class="btn-circle btn-pause">❚❚</div>
          <div class="col">
            <div class="label-gray">Série 3 sur 4 ensuite</div>
            <div class="chrono-white chrono-xl">1:12</div>
            <div class="label-gray">Repos · Développé couché</div>
          </div>
          <div class="btn-circle btn-stop">✕</div>
        </div>
      </div>`);
    add('rest-lock', '01 · repos lock', `
      <div class="lock border-red shot-root" data-shot="rest-lock">
        <div class="expanded-rest-grid">
          <div class="btn-circle btn-pause">❚❚</div>
          <div class="col">
            <div class="label-gray">Série 3 sur 4 ensuite</div>
            <div class="chrono-white chrono-xl">1:12</div>
            <div class="label-gray">Repos · Développé couché</div>
          </div>
          <div class="btn-circle btn-stop">✕</div>
        </div>
      </div>`);

    add('session-compact', '02 · séance compact', `
      <div class="compact shot-root" data-shot="session-compact">
        <div class="s-red">S2/4</div>
        <div style="color:#fff;font-weight:700;font-variant-numeric:tabular-nums;font-size:15px">32:10</div>
      </div>`);
    add('session-minimal', '06 · séance minimal', `
      <div class="minimal shot-root" data-shot="session-minimal">
        <div class="s-red min">S2</div>
      </div>`);
    add('session-expanded', '02 · séance étendu', `
      <div class="expanded shot-root" data-shot="session-expanded">
        <div class="dense-session">
          <div class="row between">
            <div class="ex">Développé couché</div>
            <div class="elapsed">32:10</div>
          </div>
          <div class="series">Série 2 sur 4</div>
          <div class="row between">
            <div class="load">80 kg × 8 reps</div>
            <button class="btn-validate">Valider</button>
          </div>
          <div class="bars"><i class="on"></i><i class="on"></i><i></i><i></i></div>
        </div>
      </div>`);
    add('session-lock', '02 · séance lock', `
      <div class="lock shot-root" data-shot="session-lock">
        <div class="dense-session">
          <div class="row between">
            <div class="ex">Développé couché</div>
            <div class="elapsed">32:10</div>
          </div>
          <div class="series">Série 2 sur 4</div>
          <div class="row between">
            <div class="load">80 kg × 8 reps</div>
            <button class="btn-validate">Valider</button>
          </div>
          <div class="bars"><i class="on"></i><i class="on"></i><i></i><i></i></div>
        </div>
      </div>`);

    add('steps-compact', '03 · pas compact', `
      <div class="compact shot-root" data-shot="steps-compact">
        <div class="ring" style="--p:0.62;--ring-color:var(--green)"></div>
        <div class="green" style="font-size:15px">6 240</div>
      </div>`);
    add('steps-minimal', '03 · pas minimal', `
      <div class="minimal shot-root" data-shot="steps-minimal">
        <div class="ring" style="--p:0.62;--ring-color:var(--green)"></div>
      </div>`);
    add('steps-expanded', '03 · pas étendu', `
      <div class="expanded shot-root" data-shot="steps-expanded">
        <div class="row" style="gap:14px;width:100%">
          <div class="ring-wrap">
            <div class="ring lg" style="--p:0.62;--ring-color:var(--green)"></div>
            <div class="pct">62 %</div>
          </div>
          <div class="col left" style="gap:2px">
            <div style="font-size:17px;font-weight:700;font-variant-numeric:tabular-nums">6 240 pas</div>
            <div class="label-gray">Objectif : 10 000</div>
            <div class="green" style="font-size:12px;font-weight:600">Encore 3 760 pas</div>
          </div>
        </div>
      </div>`);
    add('steps-lock', '03 · pas lock', `
      <div class="lock shot-root" data-shot="steps-lock">
        <div class="row" style="gap:14px;width:100%">
          <div class="ring-wrap">
            <div class="ring xl" style="--p:0.62;--ring-color:var(--green)"></div>
            <div class="pct" style="font-size:13px">62 %</div>
          </div>
          <div class="col left" style="gap:4px">
            <div style="font-size:22px;font-weight:700;font-variant-numeric:tabular-nums">6 240 pas</div>
            <div class="label-gray" style="font-size:13px">Objectif : 10 000</div>
            <div class="green" style="font-size:13px;font-weight:600">Encore 3 760 pas</div>
          </div>
        </div>
      </div>`);

    add('record-compact', '04 · record compact', `
      <div class="compact shot-root" data-shot="record-compact">
        <span class="pr">PR</span>
        <span class="orange" style="font-size:15px">+5 kg</span>
      </div>`);
    add('record-minimal', '04 · record minimal', `
      <div class="minimal shot-root" data-shot="record-minimal"><span class="pr">PR</span></div>`);
    add('record-expanded', '04 · record étendu', `
      <div class="expanded shot-root" data-shot="record-expanded">
        <div class="row" style="gap:14px;width:100%">
          <div class="pr-circle">PR</div>
          <div class="col left" style="gap:2px">
            <div class="orange" style="font-size:13px">Nouveau record !</div>
            <div style="font-size:17px;font-weight:700">Squat 120 kg</div>
            <div class="label-gray">+5 kg par rapport à l'ancien</div>
          </div>
        </div>
      </div>`);
    add('record-lock', '04 · record lock', `
      <div class="lock border-orange shot-root" data-shot="record-lock">
        <div class="row" style="gap:14px;width:100%">
          <div class="pr-circle" style="width:52px;height:52px;font-size:18px">PR</div>
          <div class="col left" style="gap:4px">
            <div class="orange" style="font-size:14px">Nouveau record !</div>
            <div style="font-size:20px;font-weight:700">Squat 120 kg</div>
            <div class="label-gray" style="font-size:12px">+5 kg par rapport à l'ancien</div>
          </div>
        </div>
      </div>`);

    add('rank-compact', '05 · rang compact', `
      <div class="compact shot-root" data-shot="rank-compact">
        <div class="diamond"></div>
        <span class="gold" style="font-size:15px">Or II</span>
      </div>`);
    add('rank-minimal', '05 · rang minimal', `
      <div class="minimal shot-root" data-shot="rank-minimal"><div class="diamond"></div></div>`);
    add('rank-expanded', '05 · rang étendu', `
      <div class="expanded shot-root" data-shot="rank-expanded">
        <div class="row" style="gap:14px;width:100%">
          <div class="diamond lg"><span>II</span></div>
          <div class="col left" style="gap:2px">
            <div class="gold" style="font-size:13px">Nouveau rang !</div>
            <div style="font-size:20px;font-weight:700">Or II</div>
            <div class="label-gray">Grâce à tes entraînements</div>
          </div>
        </div>
      </div>`);
    add('rank-lock', '05 · rang lock', `
      <div class="lock border-gold shot-root" data-shot="rank-lock">
        <div class="row" style="gap:14px;width:100%">
          <div class="diamond lg" style="width:48px;height:48px"><span>II</span></div>
          <div class="col left" style="gap:4px">
            <div class="gold" style="font-size:14px">Nouveau rang !</div>
            <div style="font-size:22px;font-weight:700">Or II</div>
            <div class="label-gray" style="font-size:12px">Grâce à tes entraînements</div>
          </div>
        </div>
      </div>`);

    const grid = document.getElementById('grid');
    for (const s of shots) {
      const el = document.createElement('div');
      el.className = 'card';
      el.innerHTML = `<h2>${s.title}</h2><div class="stage">${s.html}</div>`;
      grid.appendChild(el);
    }
    window.__SHOT_IDS__ = shots.map((s) => s.id);
  </script>
</body>
</html>
