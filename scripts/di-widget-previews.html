<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>DI Widget previews — Ranked Gym</title>
  <style>
    :root {
      --red: #FF2B2B;
      --track: #3A3A3C;
      --green: #30D158;
      --orange: #FF9F0A;
      --gold: #FFD60A;
      --pause: #2C2C2E;
      --stop: #5A1414;
      --gray: #8E8E93;
      --bg: #000;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      background: #111;
      color: #fff;
      padding: 24px;
    }
    h1 { font-size: 18px; font-weight: 600; margin: 0 0 8px; }
    .note { color: var(--gray); font-size: 12px; margin-bottom: 24px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }
    .card {
      background: #1c1c1e;
      border-radius: 16px;
      padding: 16px;
    }
    .card h2 {
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--gray);
      margin: 0 0 12px;
      font-weight: 600;
    }
    .stage {
      background: #000;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 120px;
      padding: 16px;
      position: relative;
    }
    .shot-root { display: inline-flex; }

    /* Compact island */
    .compact {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #000;
      border-radius: 999px;
      padding: 8px 12px;
      border: 1px solid #222;
    }
    .minimal {
      width: 36px; height: 36px;
      border-radius: 999px;
      background: #000;
      border: 1px solid #222;
      display: flex; align-items: center; justify-content: center;
    }
    .expanded, .lock {
      width: 100%;
      max-width: 340px;
      background: #000;
      border-radius: 28px;
      padding: 16px 18px;
      position: relative;
    }
    .expanded.border-red, .lock.border-red { outline: 2px solid var(--red); outline-offset: -2px; }
    .expanded.border-orange, .lock.border-orange { outline: 2px solid var(--orange); outline-offset: -2px; }
    .expanded.border-gold, .lock.border-gold { outline: 2px solid var(--gold); outline-offset: -2px; }

    .ring {
      width: 22px; height: 22px; border-radius: 50%;
      background: conic-gradient(var(--ring-color, var(--red)) calc(var(--p, 0.7) * 1turn), var(--track) 0);
      mask: radial-gradient(circle at center, transparent 55%, #000 57%);
      -webkit-mask: radial-gradient(circle at center, transparent 55%, #000 57%);
      transform: rotate(-90deg);
    }
    .ring.lg { width: 48px; height: 48px; }
    .chrono-red { color: var(--red); font-weight: 700; font-variant-numeric: tabular-nums; font-size: 14px; }
    .chrono-white { color: #fff; font-weight: 700; font-variant-numeric: tabular-nums; }
    .chrono-xl { font-size: 36px; line-height: 1; }
    .label-gray { color: var(--gray); font-size: 12px; }
    .row { display: flex; align-items: center; gap: 10px; }
    .row.between { justify-content: space-between; }
    .col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .btn-circle {
      width: 40px; height: 40px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      border: none; color: #fff; font-size: 14px;
    }
    .btn-pause { background: var(--pause); }
    .btn-stop { background: var(--stop); color: var(--red); font-weight: 700; }
    .btn-pill {
      background: var(--pause); color: #fff; border: none;
      border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 12px;
    }
    .btn-validate {
      background: var(--green); color: #000; border: none;
      border-radius: 999px; padding: 8px 16px; font-weight: 700; font-size: 12px;
    }
    .pr {
      background: var(--orange); color: #000; font-weight: 800; font-size: 10px;
      border-radius: 999px; padding: 2px 6px;
    }
    .diamond {
      width: 14px; height: 14px; background: var(--gold);
      transform: rotate(45deg); border-radius: 2px;
    }
    .bars { display: flex; gap: 4px; width: 100%; max-width: 140px; }
    .bars i { flex: 1; height: 6px; border-radius: 999px; background: var(--track); display: block; }
    .bars i.on { background: var(--red); }
    .s-red { color: var(--red); font-weight: 800; font-variant-numeric: tabular-nums; font-size: 12px; }
    .green { color: var(--green); font-weight: 700; }
    .orange { color: var(--orange); font-weight: 700; }
    .gold { color: var(--gold); font-weight: 700; }
    .expanded-rest-grid {
      display: grid;
      grid-template-columns: 40px 1fr 40px;
      gap: 8px;
      align-items: center;
    }
  </style>
</head>
<body>
  <h1>Dynamic Island — previews maquettes</h1>
  <p class="note">Rendu fidèle aux specs widget (agent Linux sans simulateur iOS). Captures individuelles via data-shot.</p>
  <div class="grid" id="grid"></div>
  <script>
    const shots = [];
    function add(id, title, html) {
      shots.push({ id, title, html });
    }

    add('rest-compact', 'Repos · petite bulle', `
      <div class="compact shot-root" data-shot="rest-compact">
        <div class="ring" style="--p:0.72;--ring-color:var(--red)"></div>
        <div class="chrono-red">1:12</div>
      </div>`);
    add('rest-minimal', 'Repos · bulle minimale', `
      <div class="minimal shot-root" data-shot="rest-minimal">
        <div class="ring" style="--p:0.72;--ring-color:var(--red)"></div>
      </div>`);
    add('rest-expanded', 'Repos · grande bulle', `
      <div class="expanded border-red shot-root" data-shot="rest-expanded">
        <div class="expanded-rest-grid">
          <div class="btn-circle btn-pause">❚❚</div>
          <div class="col">
            <div class="label-gray">Série 2 sur 4 ensuite</div>
            <div class="chrono-white chrono-xl">1:12</div>
            <div class="label-gray">Repos · Squat</div>
          </div>
          <div class="btn-circle btn-stop">✕</div>
        </div>
        <div style="display:flex;justify-content:center;margin-top:12px">
          <button class="btn-pill">+15 s</button>
        </div>
      </div>`);
    add('rest-lock', 'Repos · écran verrouillé', `
      <div class="lock border-red shot-root" data-shot="rest-lock">
        <div class="col">
          <div class="label-gray">Série 2 sur 4 ensuite</div>
          <div class="chrono-white chrono-xl">1:12</div>
          <div class="label-gray">Repos · Squat</div>
          <div class="row" style="margin-top:8px;gap:16px">
            <div class="btn-circle btn-pause">❚❚</div>
            <button class="btn-pill">+15 s</button>
            <div class="btn-circle btn-stop">✕</div>
          </div>
        </div>
      </div>`);

    add('session-compact', 'Séance · petite bulle', `
      <div class="compact shot-root" data-shot="session-compact">
        <div class="s-red">S2/4</div>
        <div style="color:#fff;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px">32:10</div>
      </div>`);
    add('session-minimal', 'Séance · bulle minimale', `
      <div class="minimal shot-root" data-shot="session-minimal">
        <div class="s-red">S2</div>
      </div>`);
    add('session-expanded', 'Séance · grande bulle', `
      <div class="expanded shot-root" data-shot="session-expanded">
        <div class="row between" style="margin-bottom:8px">
          <div class="bars"><i class="on"></i><i></i><i></i><i></i></div>
          <div class="label-gray">32:10</div>
        </div>
        <div class="chrono-white" style="font-size:28px;font-weight:700">80 kg × 8</div>
        <div class="bars" style="margin:10px 0"><i class="on"></i><i></i><i></i><i></i></div>
        <div style="display:flex;justify-content:flex-end"><button class="btn-validate">Valider</button></div>
      </div>`);
    add('session-lock', 'Séance · écran verrouillé', `
      <div class="lock shot-root" data-shot="session-lock">
        <div class="row between"><span></span><span class="label-gray">32:10</span></div>
        <div class="chrono-white" style="font-size:28px;font-weight:700;margin:6px 0">80 kg × 8</div>
        <div class="bars" style="margin-bottom:10px"><i class="on"></i><i></i><i></i><i></i></div>
        <div style="display:flex;justify-content:flex-end"><button class="btn-validate">Valider</button></div>
      </div>`);

    add('steps-compact', 'Pas · petite bulle', `
      <div class="compact shot-root" data-shot="steps-compact">
        <div class="ring" style="--p:0.45;--ring-color:var(--green)"></div>
        <div class="green" style="font-variant-numeric:tabular-nums">3600</div>
      </div>`);
    add('steps-minimal', 'Pas · bulle minimale', `
      <div class="minimal shot-root" data-shot="steps-minimal">
        <div class="ring" style="--p:0.45;--ring-color:var(--green)"></div>
      </div>`);
    add('steps-expanded', 'Pas · grande bulle', `
      <div class="expanded shot-root" data-shot="steps-expanded">
        <div class="row" style="gap:14px">
          <div class="ring lg" style="--p:0.45;--ring-color:var(--green)"></div>
          <div>
            <div class="green" style="font-size:22px">45 %</div>
            <div class="label-gray">Objectif : 8000</div>
            <div style="font-size:12px">Encore 4400 pas</div>
          </div>
        </div>
      </div>`);
    add('steps-lock', 'Pas · écran verrouillé', `
      <div class="lock shot-root" data-shot="steps-lock">
        <div class="row between">
          <div class="row" style="gap:14px">
            <div class="ring lg" style="--p:0.45;--ring-color:var(--green)"></div>
            <div>
              <div class="green" style="font-size:22px">45 %</div>
              <div class="label-gray">Objectif : 8000</div>
              <div style="font-size:12px">Encore 4400 pas</div>
            </div>
          </div>
          <div class="green" style="font-size:28px;font-weight:800">3600</div>
        </div>
      </div>`);

    add('record-compact', 'Record · petite bulle', `
      <div class="compact shot-root" data-shot="record-compact">
        <span class="pr">PR</span>
        <span class="orange">+5 kg</span>
      </div>`);
    add('record-minimal', 'Record · bulle minimale', `
      <div class="minimal shot-root" data-shot="record-minimal"><span class="pr">PR</span></div>`);
    add('record-expanded', 'Record · grande bulle', `
      <div class="expanded border-orange shot-root" data-shot="record-expanded">
        <div class="row" style="gap:8px;margin-bottom:8px">
          <span class="pr">PR</span><span class="orange">+5 kg</span>
        </div>
        <div style="font-size:22px;font-weight:700">Squat 120 kg</div>
      </div>`);
    add('record-lock', 'Record · écran verrouillé', `
      <div class="lock border-orange shot-root" data-shot="record-lock">
        <div class="row" style="gap:8px;margin-bottom:8px">
          <span class="pr">PR</span><span class="orange">+5 kg</span>
        </div>
        <div style="font-size:22px;font-weight:700">Squat 120 kg</div>
      </div>`);

    add('rank-compact', 'Rang · petite bulle', `
      <div class="compact shot-root" data-shot="rank-compact">
        <div class="diamond"></div>
        <span class="gold">Or</span>
      </div>`);
    add('rank-minimal', 'Rang · bulle minimale', `
      <div class="minimal shot-root" data-shot="rank-minimal"><div class="diamond"></div></div>`);
    add('rank-expanded', 'Rang · grande bulle', `
      <div class="expanded border-gold shot-root" data-shot="rank-expanded">
        <div class="row" style="gap:10px">
          <div class="diamond" style="width:22px;height:22px"></div>
          <div>
            <div class="gold" style="font-size:18px">Nouveau rang !</div>
            <div style="font-size:12px">Or</div>
          </div>
        </div>
      </div>`);
    add('rank-lock', 'Rang · écran verrouillé', `
      <div class="lock border-gold shot-root" data-shot="rank-lock">
        <div class="row" style="gap:10px">
          <div class="diamond" style="width:22px;height:22px"></div>
          <div>
            <div class="gold" style="font-size:18px">Nouveau rang !</div>
            <div style="font-size:12px">Or</div>
          </div>
        </div>
      </div>`);

    const grid = document.getElementById('grid');
    for (const s of shots) {
      const el = document.createElement('div');
      el.className = 'card';
      el.innerHTML = `<h2>${s.title}</h2><div class="stage">${s.html}</div>`;
      grid.appendChild(el);
    }
    window.__SHOT_IDS__ = shots.map((s) => s.id);
  </script>
</body>
</html>
