<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MorphButton paiement — démo Ranked Gym</title>
    <style>
      :root {
        --dissolve-primary: #ff0702;
        --dissolve-success: #16a34a;
        --dissolve-primary-foreground: #ffffff;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(ellipse at 50% 20%, #2a0505 0%, #000 55%, #000 100%);
        font-family: system-ui, -apple-system, sans-serif;
        color: #fff;
      }
      .card {
        width: min(360px, 92vw);
        padding: 28px 22px 32px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        font-weight: 700;
      }
      p {
        margin: 0 0 22px;
        font-size: 14px;
        color: #c7c7cc;
        line-height: 1.4;
      }
      #host {
        width: 100%;
      }
      .hint {
        margin-top: 18px;
        font-size: 12px;
        color: #acb4ba;
      }
      .err {
        margin-top: 12px;
        font-size: 13px;
        color: #ff0702;
        min-height: 1.2em;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Ranked Pro</h1>
      <p>Démo MorphButton — pilule → rond → Payé (DA rouge / noir / blanc).</p>
      <div id="host"></div>
      <div class="err" id="err" role="alert"></div>
      <p class="hint">Clic = succès · Shift+clic = échec (retour idle).</p>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
